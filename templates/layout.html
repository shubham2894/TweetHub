{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>
        {% block title %}
        TweetHub
        {% endblock %}
    </title>

    <style>
        body{
            background:#212529;
        }

        .tweet-image-container{
            margin-top:15px;
            border-radius:18px;
            overflow:hidden;
            background:#181818;
            border:1px solid #343a40;
        }

        .tweet-image{
            width:100%;
            height:auto;
            max-height:550px;
            display:block;
            object-fit:contain;
        }

        .card{
            border-radius:18px;
            overflow:hidden;
            border:1px solid #343a40;
        }

        .card-img-top{
            border-bottom:1px solid #343a40;
        }

        .card-body{
            padding:1.2rem;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
    <div class="container-fluid position-relative">

        <!-- Logo -->
        <a class="navbar-brand position-absolute start-50 translate-middle-x fw-bold fs-2"
           href="{% url 'tweet_list' %}">
            TweetHub
        </a>

        <!-- Right Buttons -->
        <div class="ms-auto d-flex align-items-center">

            <a href="{% url 'tweet_list' %}" class="btn btn-outline-light mx-2">
                Home
            </a>

            {% if user.is_authenticated %}

                <a href="{% url 'profile' %}" class="btn btn-warning mx-2">
                    Profile
                </a>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-danger">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'register' %}" class="btn btn-primary mx-2">
                    Register
                </a>

                <a href="{% url 'login' %}" class="btn btn-success">
                    Login
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
